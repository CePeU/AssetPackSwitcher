name: Publish documentation

on:
  push:
    branches:
      - main
    paths:
      - "AssetPackerDocs/**"
      - "quartz.config.yaml"
      - ".github/workflows/GithubPages.yml"
      
  # Allows manually starting the deployment from GitHub Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"

  # Do not interrupt an active Pages deployment.
  cancel-in-progress: false

jobs:
  build:
    name: Build Quartz
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout our repository
      #
      # fetch-depth: 0 preserves the complete Git history.
      # This is useful for metadata based on Git timestamps.
      # ------------------------------------------------------------
      - name: Checkout documentation repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Download Quartz 5
      #
      # Quartz itself does NOT have to be part of this repository.
      #
      # "v5" means we track the current Quartz 5 branch.
      #
      # For a fully reproducible build you can later replace "v5"
      # with a specific Quartz commit SHA.
      # ------------------------------------------------------------
      - name: Checkout Quartz 5
        uses: actions/checkout@v6
        with:
          repository: jackyzha0/quartz
          ref: v5
          path: quartz
          fetch-depth: 1

      # ------------------------------------------------------------
      # 3. Install Node
      #
      # Quartz 5 requires Node >= 22.
      # The official Quartz v5 workflow currently uses Node 24.
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: quartz/package-lock.json

      # ------------------------------------------------------------
      # 4. Install Quartz dependencies
      # ------------------------------------------------------------
      - name: Install Quartz dependencies
        working-directory: quartz
        run: npm ci

      # ------------------------------------------------------------
      # 5. Install our Quartz configuration
      #
      # Quartz 5 expects quartz.config.yaml in the Quartz root.
      # ------------------------------------------------------------
      - name: Install Quartz configuration
        run: |
          cp quartz.config.yaml quartz/quartz.config.yaml

      # ------------------------------------------------------------
      # 6. Install plugins referenced by quartz.config.yaml
      #
      # --from-config is useful in CI because the configuration is
      # the source of truth for the plugins our site requires.
      # ------------------------------------------------------------
      - name: Install Quartz plugins
        working-directory: quartz
        run: npx quartz plugin install --from-config

      # ------------------------------------------------------------
      # 7. Build
      #
      # We run Quartz inside ./quartz.
      #
      # Therefore:
      #
      #   ../docs
      #
      # points to our Obsidian vault.
      #
      # Quartz writes the generated website into:
      #
      #   quartz/public
      # ------------------------------------------------------------
      - name: Build documentation
        working-directory: quartz
        run: npx quartz build -d ../AssetPackerDocs

      # ------------------------------------------------------------
      # 8. Upload generated site as GitHub Pages artifact
      # ------------------------------------------------------------
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: quartz/public

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ------------------------------------------------------------
      # 9. Deploy
      # ------------------------------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4